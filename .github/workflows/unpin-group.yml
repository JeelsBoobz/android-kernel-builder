name: unpin-group
# Keeps pinning manual: Telegram auto-pins every channel post forwarded to
# the linked discussion group, displacing the manual pin. This ticks daily,
# learns the manual pin into .ci/group-pin.txt, and on a channel pin:
# unpin it + re-pin the recorded manual one. Manual pins are never
# unpinned; an empty group is respected (no restore = deliberate clear).
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write # pin-memory commits

jobs:
  unpin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder (pin memory)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Restore manual pin in discussion group
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_GROUP: ${{ secrets.TELEGRAM_GROUP_CHAT_ID }}
          TG_CHAN: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -n "$TG_TOKEN" ] && [ -n "$TG_GROUP" ] && [ -n "$TG_CHAN" ] || \
            { echo "telegram group secrets unset; skipping"; exit 0; }
          PIN_FILE=.ci/group-pin.txt
          OFF_FILE=.ci/tg-offset.txt
          RECORDED=$(cat "$PIN_FILE" 2>/dev/null || echo "")
          OFFSET=$(cat "$OFF_FILE" 2>/dev/null || echo "")
          export RECORDED OFFSET
          # 2>&1 + || guard: under bash -e a bare $(...) discards the
          # script's own diagnostics on failure (that hid a bug once).
          ACTION=$(python3 tools/telegram-unpin.py 2>&1) || PYRC=$?
          echo "$ACTION"
          [ "${PYRC:-0}" -eq 0 ] || exit "$PYRC"
          if [ -f /tmp/newpin ]; then
            NEW=$(cat /tmp/newpin); OLD=$(cat "$PIN_FILE" 2>/dev/null || echo "")
            if [ "$NEW" != "$OLD" ]; then
              mkdir -p .ci; printf '%s' "$NEW" > "$PIN_FILE"; CHANGED="$CHANGED pin"
            fi
          fi
          if [ -f /tmp/newoffset ]; then
            NEW=$(cat /tmp/newoffset); OLD=$(cat "$OFF_FILE" 2>/dev/null || echo "")
            if [ "$NEW" != "$OLD" ]; then
              mkdir -p .ci; printf '%s' "$NEW" > "$OFF_FILE"; CHANGED="$CHANGED offset"
            fi
          fi
          if [ -n "${CHANGED:-}" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$PIN_FILE" "$OFF_FILE"
            git commit -m "telegram: track group pin memory ($CHANGED )" || true
            git push || echo "WARN: pin memory push failed"
          fi
